name: Build EXE and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Single source of truth for the PyInstaller command and its exclude list.
      - name: Build EXE
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/build_exe.ps1

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Tekken8Assistant.exe
          generate_release_notes: true
