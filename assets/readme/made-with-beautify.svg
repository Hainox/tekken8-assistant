<svg xmlns="http://www.w3.org/2000/svg" width="420" height="64" viewBox="0 0 420 64" role="img" aria-labelledby="mw-title mw-desc">
  <title id="mw-title">README made with beautify-github-readme</title>
  <desc id="mw-desc">Подпись: README сделан с помощью скилла beautify-github-readme. Мотив — стрелка нотации и кнопка удара из Tekken 8 Assistant.</desc>

  <rect width="420" height="64" rx="14" fill="#0d1117" stroke="#232b36" stroke-width="1"/>

  <g id="motif" transform="translate(22 16)">
    <path d="M1 1 L17 17 M17 17 h-10 M17 17 v-10" stroke="#6ec1ff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="1" width="26" height="26" rx="6" fill="#e5a13c"/>
    <text x="37" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#141414">8</text>
  </g>

  <g id="label" transform="translate(84 0)">
    <text y="27" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8a939e" letter-spacing="2">README MADE WITH</text>
    <text y="48" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#e6e6e6">beautify-github-readme</text>
  </g>

  <g id="cue" transform="translate(388 20)">
    <path d="M0 20 L20 0 M20 0 h-11 M20 0 v11" stroke="#e5a13c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
