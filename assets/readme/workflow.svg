<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Как работает Tekken 8 Assistant</title>
  <desc id="wf-desc">Пять шагов: скриншот HUD, OCR, матчинг имени, база комбо, оверлей поверх игры.</desc>

  <rect width="1200" height="330" rx="26" fill="#0d1117"/>

  <text x="41" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8a939e" letter-spacing="4">КАК ЭТО РАБОТАЕТ</text>

  <g id="stage-1" transform="translate(41 90)">
    <rect width="190" height="130" rx="14" fill="#131a22" stroke="#232b36"/>
    <text x="16" y="32" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#e5a13c">01</text>
    <text x="16" y="64" font-family="-apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#e6e6e6">Скриншот HUD</text>
    <text x="16" y="94" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" fill="#8a939e">верхняя полоса</text>
    <text x="16" y="116" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" fill="#8a939e">каждые 2 сек</text>
  </g>
  <text x="247" y="162" text-anchor="middle" font-family="Segoe UI Symbol, Segoe UI, sans-serif" font-size="24" fill="#e5a13c">►</text>

  <g id="stage-2" transform="translate(273 90)">
    <rect width="190" height="130" rx="14" fill="#131a22" stroke="#232b36"/>
    <text x="16" y="32" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#e5a13c">02</text>
    <text x="16" y="64" font-family="-apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#e6e6e6">OCR</text>
    <text x="16" y="94" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" fill="#8a939e">Tesseract читает</text>
    <text x="16" y="116" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" fill="#8a939e">имена игроков</text>
  </g>
  <text x="479" y="162" text-anchor="middle" font-family="Segoe UI Symbol, Segoe UI, sans-serif" font-size="24" fill="#e5a13c">►</text>

  <g id="stage-3" transform="translate(505 90)">
    <rect width="190" height="130" rx="14" fill="#131a22" stroke="#232b36"/>
    <text x="16" y="32" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#e5a13c">03</text>
    <text x="16" y="64" font-family="-apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#e6e6e6">Матчинг имени</text>
    <text x="16" y="94" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" fill="#8a939e">нечёткое</text>
    <text x="16" y="116" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" fill="#8a939e">сравнение</text>
  </g>
  <text x="711" y="162" text-anchor="middle" font-family="Segoe UI Symbol, Segoe UI, sans-serif" font-size="24" fill="#e5a13c">►</text>

  <g id="stage-4" transform="translate(737 90)">
    <rect width="190" height="130" rx="14" fill="#131a22" stroke="#232b36"/>
    <text x="16" y="32" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#e5a13c">04</text>
    <text x="16" y="64" font-family="-apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#e6e6e6">База комбо</text>
    <text x="16" y="94" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" fill="#8a939e">локальная база</text>
    <text x="16" y="116" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" fill="#8a939e">+ свежие с kage</text>
  </g>
  <text x="943" y="162" text-anchor="middle" font-family="Segoe UI Symbol, Segoe UI, sans-serif" font-size="24" fill="#e5a13c">►</text>

  <g id="stage-5" transform="translate(969 90)">
    <rect width="190" height="130" rx="14" fill="#131a22" stroke="#e5a13c"/>
    <text x="16" y="32" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#e5a13c">05</text>
    <text x="16" y="64" font-family="-apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#e5a13c">Оверлей</text>
    <text x="16" y="94" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" fill="#8a939e">иконки как в игре</text>
    <text x="16" y="116" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" fill="#8a939e">поверх боя</text>
  </g>

  <text x="41" y="278" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" fill="#8a939e">Совпадение имени подтверждается несколько кадров подряд — без ложных срабатываний на экранах выбора и результатов.</text>
</svg>
